<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PondPulse</title>
<style>
body{font-family:Calibri,Arial,sans-serif;max-width:440px;margin:35px auto;padding:0 18px;color:#222}
h1{color:#0b2545;margin-bottom:5px}.subtitle{color:#666;margin-top:0}
label{display:block;margin-top:16px;font-weight:bold}
input{box-sizing:border-box;width:100%;padding:9px;margin-top:6px}
button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:4px;background:#0e9aa7;color:white;font-size:16px;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
#result{display:none;margin-top:20px;padding:14px;border:2px solid;border-radius:5px}
#result.SAFE{color:#176b35;border-color:#2e9d50}
#result.WATCH{color:#8a5700;border-color:#e2a12b}
#result.DANGER{color:#a32121;border-color:#d64545}
#error{color:#b42318;margin-top:12px}.note{color:#666;font-size:13px}
</style>
</head>
<body>
<h1>PondPulse</h1>
<p class="subtitle">Early pond health and water-quality alerts</p>
<form id="pondForm">
<label for="photo">Pond photo</label>
<input id="photo" type="file" name="photo" accept="image/*">
<label for="oxygen">Dissolved oxygen (mg/L)</label>
<input id="oxygen" name="oxygen" type="number" step="0.1" min="0" placeholder="Enter oxygen level">
<label for="ph">pH</label>
<input id="ph" name="ph" type="number" step="0.1" min="0" max="14" placeholder="Enter pH">
<label for="temperature">Water temperature (°C)</label>
<input id="temperature" name="temperature" type="number" step="0.1" placeholder="Enter temperature">
<button id="submitButton" type="submit">Check my pond</button>
</form>
<p id="error" role="alert"></p>
<div id="result" aria-live="polite">
<h2 id="risk"></h2><p id="alert"></p><p class="note" id="note"></p>
</div>
<script>
const form=document.getElementById("pondForm");
const button=document.getElementById("submitButton");
const result=document.getElementById("result");
const error=document.getElementById("error");
form.addEventListener("submit",async function(event){
 event.preventDefault(); error.textContent=""; result.style.display="none";
 button.disabled=true; button.textContent="Checking...";
 const data=new FormData(form);
 ["oxygen","ph","temperature"].forEach(name=>{if(!data.get(name))data.delete(name);});
 try{
  const response=await fetch("/api/assess",{method:"POST",body:data});
  const answer=await response.json();
  if(!response.ok)throw new Error(answer.detail||"Something went wrong.");
  document.getElementById("risk").textContent=answer.risk;
  document.getElementById("alert").textContent=answer.alert;
  document.getElementById("note").textContent=answer.note;
  result.className=answer.risk; result.style.display="block";
 }catch(err){error.textContent=err.message;}
 finally{button.disabled=false;button.textContent="Check my pond";}
});
</script>
</body>
</html>
